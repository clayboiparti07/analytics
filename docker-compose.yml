services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: analytics_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts
      - ./backend/table.sql:/docker-entrypoint-initdb.d/01-table.sql
      - ./backend/supabase_analytics_function.sql:/docker-entrypoint-initdb.d/02-function.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    restart: always
    ports:
      - "5000:5000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - DB_HOST=db
      - DB_NAME=analytics_db
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_PORT=5432
      - PORT=5000
      - FLASK_ENV=production
      - SOURCE_DB_HOST=${SOURCE_DB_HOST:-localhost}
      - SOURCE_DB_PORT=${SOURCE_DB_PORT:-5432}
      - SOURCE_DB_USER=${SOURCE_DB_USER:-postgres}
      - SOURCE_DB_PASSWORD=${SOURCE_DB_PASSWORD:-}
      - THINNAI_DB_NAME=${THINNAI_DB_NAME:-thinnai}
      - LMS_SSM_DB_NAME=${LMS_SSM_DB_NAME:-lms_ssm}
      - ODISHA_DB_NAME=${ODISHA_DB_NAME:-odisha_dashboard}
      - THINNAI_DB_TABLE=${THINNAI_DB_TABLE:-public.user_table}
      - LMS_SSM_DB_TABLE=${LMS_SSM_DB_TABLE:-public.user_table}
      - ODISHA_DB_TABLE=${ODISHA_DB_TABLE:-public.user_table}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
